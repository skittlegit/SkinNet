# Reference comparison (DECISIONS.md, section 23): checkpoint 4's data and sampling on PanDerm's
# ViT-B/16, pretrained on about 2 million skin images. Never a checkpoint: it measures what a
# skin-specific pretrained network would add. Weights: data/weights/panderm_base.pth (not in git).
extends: skinnet-c4.yaml
name: panderm
model:
  arch: panderm_base
  weights: panderm
train:
  lr: 5.0e-5                   # usual for fine-tuning a ViT-B at this batch size
  epochs: 20                   # a pretrained network needs far fewer epochs
  warmup_epochs: 2
